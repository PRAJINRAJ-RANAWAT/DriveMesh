<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
  <title>Something went wrong · DriveMesh</title>
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>
<body>
  <main class="auth-main full">
    <div class="card error-card">
      <a class="brand" href="/">{% include "_logo.html" %}DriveMesh</a>
      <h1>Something went wrong</h1>
      <p class="form-error" role="alert">{{ message }}</p>
      <a class="btn btn-primary" href="/accounts">Back to accounts <span class="arrow" aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
