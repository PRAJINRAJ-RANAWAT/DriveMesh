<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · DriveMesh</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-main full">
    <div class="panel error-card">
      <a class="brand" href="/">{% include "_logo.html" %}DriveMesh</a>
      <h1>Something went wrong</h1>
      <p class="error">{{ message }}</p>
      <a class="btn btn-primary" href="/app">Back to your files</a>
    </div>
  </main>
</body>
</html>
