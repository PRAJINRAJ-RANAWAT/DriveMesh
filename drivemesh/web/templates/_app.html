<!doctype html>
<html lang="en">
<head>
{% include "_head.html" %}
  <title>{% block title %}DriveMesh{% endblock %} · DriveMesh</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app-body">
  <a class="skip" href="#content">Skip to content</a>
  <aside class="sidebar dark" aria-label="Main">
    <a class="brand" href="/">{% include "_logo.html" %}DriveMesh</a>
    <nav class="side-nav" aria-label="App">
      <a href="/app" {% if active == "dashboard" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 13h6v4H3z"/></svg>Overview</a>
      <a href="/files" {% if active == "files" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2h6.6a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>Files</a>
      <a href="/accounts" {% if active == "accounts" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h7v5H2zM11 4h7v5h-7zM6.5 13h7v5h-7zM5.5 9l3 4M14.5 9l-3 4"/></svg>Accounts</a>
      <a href="/status" {% if active == "status" %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 11h3l2-6 3 10 2-6 2 2h4"/></svg>Status</a>
    </nav>
    <div class="side-foot">
      <span id="who" class="label muted"></span>
      <button id="logout" class="btn btn-sm">Sign out</button>
    </div>
  </aside>
  <main id="content" class="content">
    {% block content %}{% endblock %}
  </main>
  <p id="toast" class="toast hidden" role="status" aria-live="polite"></p>
  <script src="/static/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
